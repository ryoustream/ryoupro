name: 🎬 Ryou Player — Build & Release

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'

jobs:
  # ───────────────────────────────────────────────────────────────
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for commit count

      # ── Java ──────────────────────────────────────────────────
      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      # ── Versioning ────────────────────────────────────────────
      - name: 🏷️ Compute version info
        id: version
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          GIT_HASH=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y.%m.%d')
          VERSION_NAME="v1.0.0-build${BUILD_NUMBER}-api35-git${GIT_HASH}"
          VERSION_CODE=$BUILD_NUMBER

          echo "BUILD_NUMBER=$BUILD_NUMBER"         >> $GITHUB_OUTPUT
          echo "GIT_HASH=$GIT_HASH"                 >> $GITHUB_OUTPUT
          echo "DATE=$DATE"                          >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME"          >> $GITHUB_OUTPUT
          echo "VERSION_CODE=$VERSION_CODE"          >> $GITHUB_OUTPUT

          echo "📦 Version: $VERSION_NAME (code: $VERSION_CODE)"

      # ── Keystore decode ───────────────────────────────────────
      - name: 🔑 Decode keystore (release only)
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.release_type == 'release' ||
          github.event.inputs.release_type == 'both'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p ${{ github.workspace }}/build
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/build/keystore.jks
            echo "✅ Keystore decoded successfully"
          else
            echo "⚠️ KEYSTORE_BASE64 secret not set — release build will be unsigned"
          fi

      # ── Gradle permissions ────────────────────────────────────
      - name: 🔧 Grant Gradle wrapper permission
        run: chmod +x gradlew

      # ── Cache ─────────────────────────────────────────────────
      - name: 📦 Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Build Debug APK ───────────────────────────────────────
      - name: 🐛 Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PBUILD_NUMBER=${{ steps.version.outputs.BUILD_NUMBER }} \
            -PGIT_HASH=${{ steps.version.outputs.GIT_HASH }} \
            --stacktrace \
            --no-daemon
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
          GIT_HASH: ${{ steps.version.outputs.GIT_HASH }}

      # ── Build Release APK ─────────────────────────────────────
      - name: 🚀 Build Release APK
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.release_type == 'release' ||
          github.event.inputs.release_type == 'both'
        run: |
          ./gradlew assembleRelease \
            -PBUILD_NUMBER=${{ steps.version.outputs.BUILD_NUMBER }} \
            -PGIT_HASH=${{ steps.version.outputs.GIT_HASH }} \
            --stacktrace \
            --no-daemon
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
          GIT_HASH: ${{ steps.version.outputs.GIT_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ── Rename APKs ───────────────────────────────────────────
      - name: 📝 Rename APK files
        run: |
          VERSION="${{ steps.version.outputs.VERSION_NAME }}"
          DATE="${{ steps.version.outputs.DATE }}"

          # Debug
          DEBUG_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$DEBUG_SRC" ]; then
            mv "$DEBUG_SRC" "app/build/outputs/apk/debug/RyouPlayer-${VERSION}-debug.apk"
            echo "✅ Debug APK renamed"
          fi

          # Release
          RELEASE_SRC="app/build/outputs/apk/release/app-release.apk"
          RELEASE_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ -f "$RELEASE_SRC" ]; then
            mv "$RELEASE_SRC" "app/build/outputs/apk/release/RyouPlayer-${VERSION}-release.apk"
            echo "✅ Release APK renamed"
          elif [ -f "$RELEASE_UNSIGNED" ]; then
            mv "$RELEASE_UNSIGNED" "app/build/outputs/apk/release/RyouPlayer-${VERSION}-release-unsigned.apk"
            echo "✅ Unsigned Release APK renamed"
          fi

          echo "📁 APK directory contents:"
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      # ── Upload Debug Artifact ─────────────────────────────────
      - name: 📤 Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-Debug-${{ steps.version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      # ── Upload Release Artifact ───────────────────────────────
      - name: 📤 Upload Release APK artifact
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.release_type == 'release' ||
          github.event.inputs.release_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-Release-${{ steps.version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: warn

      # ── Build Summary ─────────────────────────────────────────
      - name: 📊 Build Summary
        run: |
          echo "## 🎬 Ryou Player Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.VERSION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Number | \`${{ steps.version.outputs.BUILD_NUMBER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git Hash | \`${{ steps.version.outputs.GIT_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Date | \`${{ steps.version.outputs.DATE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 APK Files" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name "*.apk" | while read f; do
            SIZE=$(du -sh "$f" | cut -f1)
            echo "- \`$(basename $f)\` — $SIZE" >> $GITHUB_STEP_SUMMARY
          done

  # ───────────────────────────────────────────────────────────────
  release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Compute version info
        id: version
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          GIT_HASH=$(git rev-parse --short HEAD)
          VERSION_NAME="v1.0.0-build${BUILD_NUMBER}-api35-git${GIT_HASH}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: 📥 Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: RyouPlayer-Debug-${{ steps.version.outputs.VERSION_NAME }}
          path: ./release-apks/debug

      - name: 📥 Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: RyouPlayer-Release-${{ steps.version.outputs.VERSION_NAME }}
          path: ./release-apks/release
        continue-on-error: true

      - name: 📋 Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD)
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" HEAD~10..HEAD)
          fi

          CHANGELOG="## 🎬 Ryou Player ${{ github.ref_name }}

**Build:** \`${{ steps.version.outputs.BUILD_NUMBER }}\`
**Commit:** \`${{ steps.version.outputs.GIT_HASH }}\`
**Date:** \`$(date +'%Y-%m-%d')\`

### 📦 What's Changed
$CHANGES

### 📱 Installation
1. Download the APK below
2. Enable \"Install from unknown sources\" in Android settings
3. Open the APK file to install

### 🔧 Minimum Requirements
- Android 9 (API 28) or higher
- 50MB free storage"

          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "🎬 Ryou Player ${{ github.ref_name }}"
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          files: |
            ./release-apks/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

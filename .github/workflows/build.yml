name: 🎬 Ryou Player — Build & Release

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: false
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: 🔨 Build APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: 🔧 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🏷️ Compute version info
        id: version
        run: |
          BUILD_NUMBER=${{ github.run_number }}
          GIT_HASH=$(git rev-parse --short HEAD)
          DATE=$(date +'%Y.%m.%d')
          VERSION_NAME="v1.0.0-build${BUILD_NUMBER}-api35-git${GIT_HASH}"
          echo "BUILD_NUMBER=$BUILD_NUMBER"   >> $GITHUB_OUTPUT
          echo "GIT_HASH=$GIT_HASH"           >> $GITHUB_OUTPUT
          echo "DATE=$DATE"                    >> $GITHUB_OUTPUT
          echo "VERSION_NAME=$VERSION_NAME"    >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION_NAME"

      - name: 🔑 Decode keystore
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.release_type == 'release' ||
          github.event.inputs.release_type == 'both'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p build
            echo "$KEYSTORE_BASE64" | base64 --decode > build/keystore.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠️  No KEYSTORE_BASE64 secret — release will be unsigned"
          fi

      - name: 📦 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 🔧 Grant wrapper permission
        run: chmod +x gradlew

      - name: 🐛 Build Debug APK
        run: |
          ./gradlew assembleDebug \
            -PBUILD_NUMBER=${{ steps.version.outputs.BUILD_NUMBER }} \
            -PGIT_HASH=${{ steps.version.outputs.GIT_HASH }} \
            --no-daemon --stacktrace
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
          GIT_HASH: ${{ steps.version.outputs.GIT_HASH }}

      - name: 🚀 Build Release APK
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.release_type == 'release' ||
          github.event.inputs.release_type == 'both'
        run: |
          ./gradlew assembleRelease \
            -PBUILD_NUMBER=${{ steps.version.outputs.BUILD_NUMBER }} \
            -PGIT_HASH=${{ steps.version.outputs.GIT_HASH }} \
            --no-daemon --stacktrace
        env:
          BUILD_NUMBER: ${{ steps.version.outputs.BUILD_NUMBER }}
          GIT_HASH: ${{ steps.version.outputs.GIT_HASH }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: 📝 Rename APKs
        run: |
          V="${{ steps.version.outputs.VERSION_NAME }}"
          for f in app/build/outputs/apk/debug/app-debug.apk; do
            [ -f "$f" ] && mv "$f" "app/build/outputs/apk/debug/RyouPlayer-${V}-debug.apk" && echo "✅ Debug renamed"
          done
          for f in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            [ -f "$f" ] && mv "$f" "app/build/outputs/apk/release/RyouPlayer-${V}-release.apk" && echo "✅ Release renamed" && break
          done
          find app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;

      - name: 📤 Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-Debug-${{ steps.version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: warn

      - name: 📤 Upload Release APK
        if: |
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == 'refs/heads/main' ||
          github.event.inputs.release_type == 'release' ||
          github.event.inputs.release_type == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: RyouPlayer-Release-${{ steps.version.outputs.VERSION_NAME }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: warn

      - name: 📊 Build Summary
        run: |
          echo "## 🎬 Ryou Player Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.VERSION_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | \`${{ steps.version.outputs.BUILD_NUMBER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.version.outputs.GIT_HASH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | \`${{ steps.version.outputs.DATE }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### APK Files" >> $GITHUB_STEP_SUMMARY
          find app/build/outputs/apk -name "*.apk" 2>/dev/null | while read f; do
            SIZE=$(du -sh "$f" | cut -f1)
            echo "- \`$(basename $f)\` — $SIZE" >> $GITHUB_STEP_SUMMARY
          done

  release:
    name: 🏷️ GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Version info
        id: version
        run: |
          echo "VERSION_NAME=v1.0.0-build${{ github.run_number }}-api35-git$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: 📥 Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: RyouPlayer-Debug-${{ steps.version.outputs.VERSION_NAME }}
          path: ./apks/debug
        continue-on-error: true

      - name: 📥 Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: RyouPlayer-Release-${{ steps.version.outputs.VERSION_NAME }}
          path: ./apks/release
        continue-on-error: true

      - name: 🚀 Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🎬 Ryou Player ${{ github.ref_name }}"
          body: |
            ## 🎬 Ryou Player ${{ github.ref_name }}

            **Build:** `${{ github.run_number }}`
            **Date:** `$(date +'%Y-%m-%d')`

            ### Install
            Download APK → Enable unknown sources → Install

            ### Minimum: Android 9 (API 28)
          files: ./apks/**/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

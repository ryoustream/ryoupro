name: Android CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake (pinned versions from build.gradle.kts)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download prebuilt mpvlib.aar
        # app/libs/mpvlib.aar is deliberately gitignored (see
        # app/libs/Donwlod-Mpvlibs.md) - too large to keep in the repo.
        # Mirrors that file's manual instructions as an automated CI step.
        run: |
          mkdir -p app/libs
          curl -fsSL -o app/libs/mpvlib.aar \
            "https://github.com/SunnyVishnu3/mpvlibAndroid/releases/latest/download/mpvlib.aar"
          ls -la app/libs/mpvlib.aar

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle_output.log
        continue-on-error: true

      - name: Surface failure details as annotations
        if: steps.build.outcome == 'failure'
        run: |
          echo "### Gradle build failed - key lines:" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|Error:|FAILED|What went wrong|Caused by:|^e: " gradle_output.log | tail -50 > errors.txt || true
          cat errors.txt >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            esc=$(printf '%s' "$line" | sed 's/%/%25/g' | tr -d '\r')
            echo "::error::${esc}"
          done < errors.txt
          exit 1

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nokvez-play-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          retention-days: 7
